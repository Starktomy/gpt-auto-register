[project]
name = "regix"
version = "0.1.0"
description = "Protocol-first registration automation platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.7.0",
    "fastapi>=0.110.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
regix = "regix.cli.main:main"
regix-legacy = "regix.cli.register_outlook:main"
regix-webui = "regix.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regix"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
